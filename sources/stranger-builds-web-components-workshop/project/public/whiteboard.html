<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Basic Video Call with Whiteboard" />
    <title>Basic Video Call with Whiteboard</title>

    <link rel="stylesheet" href="/styles.css" />

    <script src="https://video.standard.vonage.com/v2/js/opentok.min.js"></script>

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@vonage/video-publisher@latest/video-publisher.js/+esm"></script>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@vonage/video-subscriber@latest/video-subscriber.js/+esm"></script>

    <!-- Load Web Component -->

    <script src="/whiteboard.js" defer></script>
</head>

<body>
    <a href="/">back</a>
    <header>
        <h1>Basic Video Call with Whiteboard</h1>
    </header>
    <main id="video-chat-container">
        <section id="publisher-container">
            <fieldset>
                <legend>Publisher</legend>
                <video-publisher></video-publisher>
            </fieldset>
            <button id="video-toggle">toggle Video</button>
            <button id="audio-toggle">toggle Audio</button>
            <br /><br />
            <button id="whiteboard-button">open whiteboard</button>
        </section>
        <section id="video-subscriber-container">
            <div id="custom"></div>
            <div id="camera"></div>
        </section>
    </main>
    <dialog id="whiteboard-dialog">
        <form method="dialog">
            <button>close</button>
        </form>
        <!-- Place white-board here -->
        
    </dialog>
</body>

</html>
